[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-telegram-bot"
version = "0.1.0"
description = "Telegram astrology bot: natal chart, horoscope, tarot, AI chat, Stars Pro"
requires-python = ">=3.11"
dependencies = [
  "aiogram[redis]>=3.13.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "redis>=5.2.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "pyswisseph>=2.10.3",
  "timezonefinder>=6.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "aiosqlite>=0.20.0",
  "fakeredis>=2.26.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
omit = [
  "app/migrations/*",
  "app/main.py",
  "app/bot/handlers/*",
  "app/bot/factory.py",
  "app/bot/middlewares.py",
  "app/api/*",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
